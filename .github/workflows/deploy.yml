name: Continuous Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-to-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Step 1: Checkout Code
        uses: actions/checkout@v4

      - name: Step 2: Setup GitHub Pages Platform
        uses: actions/configure-pages@v5

      - name: Step 3: Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Step 4: Deploy Artifact to Production Environment
        id: deployment
        uses: actions/deploy-pages@v4
